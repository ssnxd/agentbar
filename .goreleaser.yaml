# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agentbar

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/agentbar
    binary: agentbar
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: ssnxd
    name: agentbar
  footer: |
    ---
    A tmux sidebar for running Claude Code sessions. Requires tmux >= 3.2. Run `agentbar install` then `agentbar doctor`.
