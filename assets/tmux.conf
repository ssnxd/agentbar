# workflow — managed tmux server config (dedicated socket, do not edit)

# No prefix. The only global key is Ctrl-Q to detach.
unbind-key -a
set -g prefix None
set -g prefix2 None
bind-key -n C-q detach-client
bind-key -T copy-mode C-q detach-client
bind-key -T copy-mode-vi C-q detach-client

# Terminal / colors
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -s escape-time 10
set -g focus-events on

# Behavior
set -g history-limit 50000
set -g default-size 220x50
set -g remain-on-exit on
set -g automatic-rename off
set -g allow-rename off
set -g renumber-windows off
set -g mouse on
set -g destroy-unattached off

# Status bar: identify the managed server and show the exit key.
set -g status on
set -g status-position top
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left ' workflow · #S · #W '
set -g status-left-length 80
set -g status-right ' Ctrl-Q detach '
set -g status-right-style 'fg=#7aa2f7,bold'
set -g window-status-current-style 'fg=#7aa2f7,bold'
